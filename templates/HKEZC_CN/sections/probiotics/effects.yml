Lactobacillus rhamnosus: "是人體常見的菌群，容易在消化道駐紮，還能幫助其他菌種的生長，定時足量補充能幫助失衡的消化道恢復菌叢平衡。它能通過調節免疫系統、增強腸道粘膜屏障，減少過敏反應和濕疹症狀，並有助減少受感染的機率、預防和治療腹瀉、結合並排除毒素、降低齲齒(俗稱蛀牙)的風險。"
Lactobacillus acidophilus: "除了存在於母乳之外，也存在於腸胃道、泌尿道及皮膚之中，能調節腸道微生物群，增強腸道屏障，從而減少過敏和濕疹症狀。同時具有抗炎作用，有助減少免疫系統過度反應，改善皮膚健康。這種益生菌可有效緩解過敏性皮膚問題，更被發現有助於改善嬰幼兒腸絞痛與腹瀉。"
Bifidobacterium lactis: "常見於人類的大腸內，能黏附在大腸黏膜表面，形成防護層，幫助改善腸道健康、抑制壞菌滋生，促進健康的腸道微生物群，增強免疫系統，幫助減少過敏反應和濕疹症狀，抑制過度劇烈的免疫反應及發炎狀況，如濕疹，促進皮膚屏障修復，有助於維持皮膚的健康和平衡，適合飲食不規律、排便困難的族群。"
Lactobacillus paracasei: "廣泛存活於人體的口腔及腸道內，能修補腸壁受損、抑制腸道內有害菌繁殖，提高免疫調節功能。通過抑制免疫系統內引致過敏發炎的白介素(Interleukins)來改善及減輕過敏症狀，並調節人體免疫系統對過敏的反應，減低過敏症引發頻率。調節消化道內菌落平衡、增進食慾和緩解腸胃不適，適合精神壓力大、不愛吃飯的人群。"
Lactobacillus casei: "存在於人體的腸道及口腔，常見於發酵食物中，和其他益生菌共同服用時，能降低抗生素相關腹瀉的發病率。通過促進腸道健康，減少全身性過敏反應和皮膚炎症。它有助於平衡免疫系統，減輕濕疹症狀，並減少過敏性皮膚疾病的發生頻率，或能抑制皮質醇，舒緩與壓力有關的徵狀。"
Bifidobacterium bifidum: "常見於人類或哺乳類動物的腸道內，是人體重要的益生菌之一，不少食品如乳酪等的發酵過程都會加入此菌種，能產生乳酸，並抑制有害菌的生長，平衡腸道微生物，減少過敏和濕疹的發作。它能促進免疫調節，減少皮膚炎症反應，改善皮膚的屏障功能，並緩解過敏性皮膚症狀。"
Lactobacillus plantarum: "透過代謝產生有機酸、過氧化氫和雙乙醯等多種天然抑菌物質，增強皮膚屏障功能和抑制有害菌，改善濕疹症狀皮膚炎症和過敏反應，並促進皮膚修復。它亦能促進腸道營養吸收，緩和乳糖不耐症，並減低腫瘤細胞形成的風險。"
Bifidobacterium breve: "隨著年齡增加會漸漸減少，不良的飲食或生活習慣則會大量減少短雙歧桿菌量。它可提升人體自身製造干擾素的能力，加強產生自身之抵抗力增加及修補因細菌侵襲或醫療行為而受損之細胞，增強腸道屏障和減少炎症來幫助維持皮膚健康，減輕過敏和皮膚敏感。它亦可抑制有害菌、防止便秘，還能產生各種維他命如B1、B2、B6、B12、葉酸等以供人體所需和通過抑制某些維他命分解菌來保障維他命的供應。"
Lactobacillus bulgaricus: "常被用於製造發酵食品，例如乳酪、醃製食品等，具有抗炎特性，能減少過敏和濕疹的發生率。它通過調節免疫系統，降低皮膚炎症，改善過敏性皮膚症狀，並促進皮膚修復和健康。"
Bifidobacterium longum: "有助於改善腸道健康，具有修復黏液層、調節腸道平衡的功用，減少過敏反應，並緩解濕疹症狀。它能增強免疫系統的穩定性，減少皮膚炎症，並促進皮膚屏障功能，改善皮膚的保濕能力。"
Lactobacillus salivarius: "存在於人體小腸與口腔當中，為人類唾液中普遍存在的一種細菌，刺激免疫細胞分泌抗過敏相關細胞激素濃度，減少過敏反應和皮膚炎症。它有助於平衡腸道微生物，減少腸道病原體定殖，預防慢性疾病。"
Streptococcus thermophilus: "對人體無害，於人體內產生乳糖酶，將乳糖分解成單醣，從而協助乳糖不耐症患者消化乳製品，減少當中過敏反應。嗜熱鏈球菌促進皮層細胞生長，改善皮膚屏障功能，緩解濕疹和過敏性皮膚症狀。它具有保濕和抗氧化效果，幫助減少皮膚炎症，並促進皮膚健康和修復，特別對乾燥和敏感皮膚有益。"