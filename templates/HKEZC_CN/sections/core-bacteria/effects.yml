Akkermansia muciniphila: 促進腸道黏液層完整性，維持腸道屏障功能，可能減少過敏反應並保護皮膚健康。
Alistipes putredinis: 參與短鏈脂肪酸的生成，有助於維持腸道健康和減少炎症。
Bacteroides: 調節腸道微生物平衡，支持腸道健康，有助於減少過敏反應。
Bacteroides fragilis: 有助於維持腸道屏障功能和免疫系統的健康，對抗炎症。
Clostridium cluster IV: 促進腸道健康，幫助維持微生物群的穩定性，並減少過敏性反應。
Faecalibacterium prausnitzii: 抗炎作用強，有助於減少腸道炎症，支持健康的免疫反應，對濕疹有保護作用。
Roseburia hominis: 抗炎作用強，有助於減少腸道炎症，支持健康的免疫反應，對濕疹有保護作用。
Ruminococcus: 參與纖維素分解和短鏈脂肪酸的生成，對腸道健康有益。