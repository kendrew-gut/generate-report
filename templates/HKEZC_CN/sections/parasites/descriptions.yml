Roundworms: "長度可達 20 厘米。蟲身淺褐色或粉紅色，兩端尖幼。蛔蟲的幼蟲和成蟲寄生在人體的小腸內，蟲卵經糞便排出體外。如果患者在廁所設施外排便或將糞便用作肥料，蟲卵可以存留在土壤中。"
Pinworms: "長約 1 厘米，狀似短線。蟯蟲寄生於人體的大腸及直腸內，雌性蟯蟲在晚間蠕行至肛門處產卵，可引致局部痕癢。患者的手指在搔癢時可能受到污染。如患者於處理食物前沒有徹底洗手，其他吃了受污染食物的人便可能受到感染。"
Hookworms: "長約 1 厘米，寄生在人體的小腸內，依附在腸壁上導致出血，並引致患者貧血。如果患者在廁所設施外排便或將糞便用作肥料，蟲卵可以存留在土壤中。蟲卵可在泥土孵化及生長成為幼蟲。人類若接觸受污染的泥土，幼蟲可能會穿透皮膚，引致感染。"
Tapeworms: "可長至6米以上。縧蟲寄生在最終宿主的小腸內，蟲卵隨糞便排出及進入環境中，並被中間宿主（例如豬、牛和魚）攝入。蟲卵在中間宿主的肌肉或其他器官中孵化成為幼蟲包囊。人若進食了未經煮熟及受污染的豬肉、牛肉或魚，便可能受到成蟲感染。"
Liver Fluke: "約 1 至 2 厘米長，寄生在人的肝臟膽管內，蟲卵經糞便排出體外。蟲卵被淡水池塘內的水螺吃下後會在其體內發育成為自由浮游形態 (尾動幼蟲)。尾動幼蟲在池塘內與魚皮接觸後會穿入魚肉成為包囊形態。人若進食了未經煮熟及受感染的淡水魚，便可能受到感染。"
