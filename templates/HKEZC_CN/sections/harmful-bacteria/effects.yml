Candida albicans: 白色念珠菌是一種能造成伺機性感染的酵母菌珠菌。這種真菌可能導致腸道菌群失衡，增加過敏風險，與濕疹的惡化有關。有研究顯示此菌之增生，與飲食習慣有一定關係。
Escherichia coli: 大腸桿菌過度生長可能破壞腸道屏障，促進炎症反應 ，增加過敏及濕疹風險。耐熱性差，一般烹調溫度即可殺死。在衛生學上，常被用做飲用水、食品的衛生檢定指標。
Staphylococcus aureus: 大腸桿菌過度生長可能破壞腸道屏障，促進炎症反應，增加過敏及濕疹風險。耐熱性差，一般烹調溫度即可殺死。在衛生學上，常被用做飲用水、食品的衛生檢定指標。
Clostridium difficile: "高危族群包括: 常服用抗生素(特別是廣譜抗生素) 的病人。傳播途徑包括觸碰糞便、受污染的表面或食物，包括便盆、家具、床單和馬桶等。"
Pseudomonas aeruginosa: 綠膿桿菌可能加劇皮膚感染，並與濕疹症狀的惡化有關。綠膿桿菌存在潮濕的環境、土壤和水中，亦可暫時寄生於皮膚，主要寄生在肛門、生殖器部位、腋窩和外耳道等。
Proteus mirabilis: 可引起尿路和皮膚感染，並可能導致過敏反應的增加，與濕疹惡化有關。有研究指奇異變形桿菌與受感染肉類及水產有關，也見於涼拌菜、剩飯菜和豆製品。
Klebsiella pneumoniae: 可引發嚴重感染，並且與腸道菌群失衡和濕疹症狀惡化有關。有研究顯示此菌種不會透過空氣傳染，主要透過接觸傳播，如手術或傷口處理等侵入性過程而感染。